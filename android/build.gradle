buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["InAppUpdate_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // Only used when the library is built on its own; a consuming app's plugin versions win.
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

// AGP 9 compiles Kotlin itself and fails the build if the Kotlin Android plugin is applied
// on top. Apps can opt out with `android.builtInKotlin=false`, and AGP 8 has no built-in
// Kotlin, so the plugin is applied only in those cases.
def shouldApplyKotlinPlugin() {
  def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpMajorVersion <= 8) {
    return true
  }
  def builtInKotlin = providers.gradleProperty("android.builtInKotlin").orNull
  return builtInKotlin != null && !builtInKotlin.toBoolean()
}

apply plugin: "com.android.library"

if (shouldApplyKotlinPlugin()) {
  apply plugin: "kotlin-android"
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["InAppUpdate_" + name]).toInteger()
}

android {
  namespace "com.thronie.inappupdate"

  compileSdk getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk getExtOrIntegerDefault("minSdkVersion")
    targetSdk getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  // The React Native Gradle plugin aligns the Kotlin JVM target with these in consuming apps.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      // AGP 9 built-in Kotlin only compiles Kotlin from `kotlin` source directories.
      def archSrcDir = isNewArchitectureEnabled() ? "src/newarch" : "src/oldarch"
      java.srcDirs += [archSrcDir]
      kotlin.srcDirs += [archSrcDir]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Version is resolved by the React Native Gradle plugin in the consuming app
  implementation "com.facebook.react:react-android"
  implementation "com.google.android.play:app-update:2.1.0"
}
